template: testify
packages:
  github.com/avito-tech/go-transaction-manager/trm/v2:
    interfaces:
      Manager:
        config:
          pkgname: "usecase"
          dir: "internal/usecase"
          filename: "trm_mocks.go"
  github.com/PritOriginal/problem-map-server/internal/events:
    config:
      all: true
      filename: "mocks.go"
  github.com/PritOriginal/problem-map-server/internal/usecase:
    config:
      all: true
  github.com/PritOriginal/problem-map-server/internal/handler:
    config:
      all: true
      recursive: true
  github.com/PritOriginal/problem-map-server/internal/grpc:
    config:
      all: true
      recursive: true
  github.com/PritOriginal/problem-map-server/internal/auth:
    config:
      all: true
      filename: "mocks.go"
  github.com/PritOriginal/problem-map-server/internal/middleware:
    config:
      # Not `all`: VersionChecker is an alias of auth.VersionChecker and its
      # mock lives in package auth.
      include-interface-regex: "^VersionSource$"
      filename: "mocks.go"
  github.com/PritOriginal/problem-map-server/internal/middleware/cache:
    config:
      all: true
      filename: "mocks.go"
  github.com/PritOriginal/problem-map-server/internal/middleware/ratelimit:
    config:
      all: true
      filename: "mocks.go"
