      Manager:
        config:
          pkgname: "usecase"
          dir: "internal/usecase"
          filename: "trm_mocks.go"
  github.com/PritOriginal/problem-map-server/internal/usecase:
    config:
      all: true
  github.com/PritOriginal/problem-map-server/internal/handler:
