services:
  server:
    build:
      context: .
      dockerfile: ./docker/rest/Dockerfile
      target: final
    container_name: server-rest
    restart: unless-stopped
    networks:
      - server-network
    # Config is not baked into the image: it is mounted read-only and
    # can be overridden by environment variables from the same file.
    env_file:
      - ./configs/.env.docker
    volumes:
      - ./configs/.env.docker:/etc/problem-map/.env:ro
    ports:
      - ${REST_PORT}:${REST_PORT}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  postgres:
    image: postgis/postgis
    container_name: postgres
    restart: always
    user: postgres
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    networks:
      - server-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    expose:
      - ${REDIS_PORT}
    networks:
      - server-network
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    image: migrate/migrate
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - server-network
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations/", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}", "up"]
  osm2pgsql:
    image: iboates/osm2pgsql:latest
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - server-network
    volumes:
      - ./osm:/osm
    command: ["osm2pgsql", "-H", "${POSTGRES_HOST}", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-c", "-O", "flex", "-S", "/osm/import.lua", "/osm/data/data.osm.pbf"]


networks:
  server-network:

volumes:
  postgres-data:
