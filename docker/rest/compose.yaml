# Relative paths below (./configs, ./migrations, ./osm) are resolved against
# the repository root: run via `make docker-rest|docker-grpc` or pass
# `--project-directory .` to `docker compose`.
services:
  server:
    build:
      context: .
      dockerfile: ./docker/rest/Dockerfile
      target: final
    container_name: server-rest
    restart: always
    networks:
      - server-network
    env_file:
      - ./configs/.env.docker
    volumes:
      - ./configs/.env.docker:/etc/problem-map/.env:ro
    ports:
      - ${REST_PORT}:${REST_PORT}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  postgres:
    image: postgis/postgis
    container_name: postgres
    restart: always
    user: postgres
    ports:
      - ${POSTGRES_PORT}:${POSTGRES_PORT}
    networks:
      - server-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    expose:
      - ${REDIS_PORT}
    networks:
      - server-network
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    image: migrate/migrate
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - server-network
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations/", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}", "up"]
  # Optional event broker + notification worker: `docker compose --profile nats up`.
  # Set NATS_URL=nats://nats:4222 in configs/.env.docker so the REST server
  # publishes events; without it events are dropped (NoopPublisher).
  # JetStream (-js) persists the events in /data so the notifier can be
  # down without losing notifications (see README, "События и доставка").
  nats:
    image: nats:2-alpine
    container_name: nats
    restart: always
    profiles: ["nats"]
    expose:
      - 4222
    networks:
      - server-network
    volumes:
      - nats-data:/data
    command: ["--name", "problem-map", "--http_port", "8222", "-js", "-sd", "/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
  notifier:
    build:
      context: .
      dockerfile: ./docker/notifier/Dockerfile
      target: final
    container_name: notifier
    restart: always
    profiles: ["nats"]
    networks:
      - server-network
    env_file:
      - ./configs/.env.docker
    volumes:
      - ./configs/.env.docker:/etc/problem-map/.env:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
  osm2pgsql:
    image: iboates/osm2pgsql:latest
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - server-network
    volumes:
      - ./osm:/osm
    command: ["osm2pgsql", "-H", "${POSTGRES_HOST}", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}", "-c", "-O", "flex", "-S", "/osm/import.lua", "/osm/data/data.osm.pbf"]


networks:
  server-network:

volumes:
  postgres-data:
  nats-data:
