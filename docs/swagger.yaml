      tags:
      - auth
  /badges:
    get:
      description: get every badge that can be earned; names and descriptions are
        localised by `Accept-Language`
      parameters:
      - description: ru (default) or en
        in: header
        name: Accept-Language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_achievements_GetBadgesResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      summary: Badge catalogue
      tags:
      - achievements
  /checks:
    post:
      consumes:
      - multipart/form-data
      description: add check; the mark's author may not check their own mark (403),
        one check per voting stage (409), at most `rating.max-checks-per-day` checks
        per rolling 24 hours (429)
      parameters:
      - description: 'UUID chosen by the client; a repeat with the same key within
          24h returns the stored response with `Idempotent-Replayed: true` (425 while
          the first request is in flight, 422 when reused with other form fields)'
        in: header
        name: Idempotency-Key
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_checks_AddCheckResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "422":
          description: Idempotency-Key reused with a different payload (`error.code`
            is `idempotency_key_reused`)
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "425":
          description: a request with the same Idempotency-Key is in flight (`error.code`
