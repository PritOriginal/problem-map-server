        type: integer
      organization_id:
        description: |-
          OrganizationID is the city service assigned to resolve the mark; null
          until the mark is confirmed and a responsible organization is found.
        type: integer
      sla_due_at:
        description: SLADueAt is the deadline the organization has to resolve the
          mark.
        format: date-time
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
