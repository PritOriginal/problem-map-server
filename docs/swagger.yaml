        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/logout-all:
    post:
      description: revoke all refresh tokens of the current user and invalidate every
        issued access token
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: Logout everywhere
      tags:
      - auth
  /auth/signin:
    post:
      consumes:
      - application/json
      description: sign in user
      parameters:
      - description: query params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
