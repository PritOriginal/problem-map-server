        $ref: '#/definitions/null.Value-github_com_PritOriginal_problem-map-server_internal_models_MarkStatusType'
      prev_id:
        $ref: '#/definitions/null.Int'
    type: object
  github_com_PritOriginal_problem-map-server_internal_models.MarkStatusType:
    enum:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    type: integer
    x-enum-varnames:
    - UnconfirmedStatus
    - ConfirmedStatus
    - UnderReviewStatus
    - RediscoveredStatus
    - ClosedStatus
    - RefutedStatus
    - InProgressStatus
    - DuplicateStatus
  github_com_PritOriginal_problem-map-server_internal_models.MarkType:
    properties:
      active:
        description: |-
          Active reports whether new marks of the type may be created; inactive
          types are hidden from the public dictionary.
        type: boolean
      code:
        type: string
      color:
        description: Color is a hex colour like "#ff8800" (optional).
        type: string
      icon:
        description: Icon is a client-side icon identifier (optional).
        type: string
      id:
        type: integer
      mark_type_id:
        description: |-
          LegacyID mirrors ID under the key older clients read; it is filled
          by MarshalJSON. Deprecated: use ID (`id`).
        type: integer
      name:
        type: string
      name_en:
        type: string
      name_ru:
        description: |-
          NameRU and NameEN are the stored translations; only the admin
          endpoints fill them in (the public dictionary carries Name in the
          requested language).
        type: string
      sla_hours:
        description: SLAHours is the time an organization has to resolve a mark of
          the type.
        type: integer
      sort_order:
        description: SortOrder orders the dictionary (ascending, then by name).
        type: integer
    type: object
