  /marks/export:
    get:
      description: 'stream every marker matching the same filters as GET /marks (no
        pagination) as GeoJSON FeatureCollection or CSV (UTF-8 with BOM; a description
        starting with =, +, -, @ is prefixed with an apostrophe against formula injection).
        At most `export.max-rows` (50 000 by default) rows: a wider selection is rejected
        with 400 "narrow the filters". Rate limited per IP (2 per minute by default)'
      parameters:
      - description: file format
        enum:
        - geojson
        - csv
        in: query
        name: format
        required: true
        type: string
      - description: filter by mark types, comma-separated ids
        in: query
        name: mark_type_ids
        type: string
      - description: filter by mark statuses, comma-separated ids
        in: query
        name: mark_status_ids
        type: string
      - description: filter by author
        in: query
        name: user_id
        type: integer
      - description: bounding box minLon,minLat,maxLon,maxLat (WGS84)
        in: query
        name: bbox
        type: string
      - description: created_at >= (RFC3339 or YYYY-MM-DD, taken as 00:00:00 UTC)
        in: query
        name: created_from
        type: string
      - description: created_at <= (RFC3339 or YYYY-MM-DD, taken as the end of that
          day in UTC)
        in: query
        name: created_to
        type: string
      - default: created_at
        description: sort column
        enum:
        - created_at
        - updated_at
        in: query
        name: sort
        type: string
      - default: desc
        description: sort order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/geo+json
      - text/csv
      responses:
        "200":
          description: 'the file; Content-Disposition: attachment'
          schema:
            type: string
        "400":
          description: invalid filters or too many rows (narrow the filters)
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Export markers
      tags:
      - marks
