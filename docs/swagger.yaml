        "422":
          description: Idempotency-Key reused with a different payload (`error.code`
            is `idempotency_key_reused`)
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "425":
          description: a request with the same Idempotency-Key is in flight (`error.code`
            is `idempotency_in_flight`); retry after `Retry-After` seconds
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
