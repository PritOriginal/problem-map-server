        $ref: '#/definitions/github_com_PritOriginal_problem-map-server_internal_models.PolygonJSON'
      name:
        type: string
    type: object
  github_com_PritOriginal_problem-map-server_internal_models.KPI:
    properties:
      avg_close_hours:
        description: AvgCloseHours is the mean unconfirmed -> closed time; null when
          no mark was closed.
        type: number
      avg_confirm_hours:
        description: AvgConfirmHours is the mean unconfirmed -> confirmed time; null
          when no mark was confirmed.
        type: number
      by_organization:
        description: ByOrganization lists the assigned marks per organization.
        items:
          $ref: '#/definitions/github_com_PritOriginal_problem-map-server_internal_models.OrganizationKPI'
        type: array
      by_status:
        additionalProperties:
          type: integer
        type: object
      median_confirm_hours:
        description: MedianConfirmHours is the median unconfirmed -> confirmed time;
          null when no mark was confirmed.
        type: number
      open_older_than_30d:
        description: |-
          OpenOlderThan30d counts marks neither closed nor refuted that were
          created more than 30 days ago.
        type: integer
      refuted_share:
        description: RefutedShare is refuted marks / total (0 when there are no marks).
        type: number
      sla_breach_share:
        description: |-
          SLABreachShare is the share of marks assigned to an organization whose
          SLA deadline has passed while they are still confirmed or in progress
          (0 when no mark is assigned).
        type: number
      total:
        type: integer
    type: object
  github_com_PritOriginal_problem-map-server_internal_models.Level:
    properties:
      name:
        type: string
      next_threshold:
        description: |-
          NextThreshold is the rating that starts the next level; nil at the
          last level.
        type: integer
      number:
        type: integer
    type: object
  github_com_PritOriginal_problem-map-server_internal_models.Mark:
    properties:
      comments_count:
        description: |-
          CommentsCount is the number of comments on the mark that are not
          deleted.
        type: integer
      created_at:
        type: string
      description:
        type: string
      followers_count:
        description: FollowersCount is the number of users following the mark.
        type: integer
      geom:
        $ref: '#/definitions/github_com_PritOriginal_problem-map-server_internal_models.PointJSON'
      hidden:
        description: |-
          Hidden marks are excluded from public lists, maps and exports; only
          the author and moderators see them (auto-hidden after
          reports.hide-threshold open reports, or by a moderator).
        type: boolean
      is_following:
        description: |-
          IsFollowing reports whether the viewer (see ContextWithViewer) follows
          the mark; always false for anonymous requests.
        type: boolean
      is_overdue:
        description: |-
          IsOverdue reports whether SLADueAt has passed while the mark is still
          confirmed or in progress (computed on read).
        type: boolean
      mark_id:
        type: integer
      mark_status_id:
        $ref: '#/definitions/github_com_PritOriginal_problem-map-server_internal_models.MarkStatusType'
      mark_type_id:
        type: integer
      merged_into_id:
        description: |-
          MergedIntoID is the mark this one was merged into as a duplicate
          (status DuplicateStatus); null otherwise.
        type: integer
      organization_id:
        description: |-
          OrganizationID is the city service assigned to resolve the mark; null
          until the mark is confirmed and a responsible organization is found.
        type: integer
      sla_due_at:
        description: SLADueAt is the deadline the organization has to resolve the
          mark.
        format: date-time
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  github_com_PritOriginal_problem-map-server_internal_models.MarkBrief:
    properties:
      created_at:
        type: string
      description:
        type: string
      geom:
        $ref: '#/definitions/github_com_PritOriginal_problem-map-server_internal_models.PointJSON'
      hidden:
        type: boolean
      mark_id:
        type: integer
      mark_status_id:
        $ref: '#/definitions/github_com_PritOriginal_problem-map-server_internal_models.MarkStatusType'
      mark_type_id:
        type: integer
      user_id:
        type: integer
    type: object
  github_com_PritOriginal_problem-map-server_internal_models.MarkStatus:
    properties:
      code:
        type: string
      id:
        type: integer
      mark_status_id:
        description: |-
          LegacyID mirrors ID under the key older clients read; it is filled
          by MarshalJSON. Deprecated: use ID (`id`).
        type: integer
      name:
        type: string
      parent_id:
        $ref: '#/definitions/null.Int'
    type: object
  github_com_PritOriginal_problem-map-server_internal_models.MarkStatusHistoryItem:
