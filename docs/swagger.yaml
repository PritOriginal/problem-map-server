  /users/me/sync:
    get:
      description: 'one request for a client coming back online: the caller''s tasks
        updated after `since`, unread notifications received after it and checks submitted
        after it. Each collection is paged independently by limit/offset; `totals`
        carry the full counts. Store `server_time` and pass it as the next `since`;
        with several server instances subtract a safety margin (`server_time - 1s`)
        to cover clock skew between them. `since` in the future is rejected with 400'
      parameters:
      - description: instant of the previous sync (RFC3339 or YYYY-MM-DD)
        in: query
        name: since
        required: true
        type: string
      - default: 100
        description: page size of each collection, 1..500
        in: query
        name: limit
        type: integer
      - default: 0
        description: page offset of each collection
        in: query
