        type: boolean
      mark_id:
        type: integer
      mark_status_id:
        $ref: '#/definitions/github_com_PritOriginal_problem-map-server_internal_models.MarkStatusType'
      mark_type_id:
        type: integer
      merged_into_id:
        description: |-
