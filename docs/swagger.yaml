info:
  contact: {}
  description: This is the API documentation for the "Problem Map" project.
  title: Problem Map API
  version: "1.0"
paths:
  /admin/mark-types:
    get:
      description: all mark types, inactive ones included, with name_ru/name_en, sorted
        by sort_order and name
      parameters:
      - description: ru (default) or en
        in: header
        name: Accept-Language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_admin_MarkTypesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: List mark types (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: adds a mark type with its Russian and optional English name; 409
        when the code is taken
      parameters:
      - description: mark type
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_admin.CreateMarkTypeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_admin_MarkTypeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: Create mark type
      tags:
      - admin
  /admin/mark-types/{id}:
    patch:
      consumes:
      - application/json
      description: 'changes the given fields of a mark type (names, icon, color, SLA,
        active, sort_order); omitted fields stay unchanged. Deactivating a type is
        allowed even when it has marks: they keep the type, it only disappears from
        GET /marks/types (POST /marks does not check it). 409 when the new code is
        taken'
      parameters:
      - description: mark type id
        in: path
        name: id
        required: true
        type: integer
      - description: fields to change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_admin.UpdateMarkTypeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_admin_MarkTypeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: Update mark type
      tags:
      - admin
  /admin/settings:
    get:
      description: current values of the admin-editable settings (database, or the
        config defaults until the first PUT)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_admin_SettingsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: Get runtime settings
      tags:
      - admin
    put:
      consumes:
      - application/json
      description: stores the settings document after range validation (omitted fields
        keep their current values); the change is applied within 30 s on every instance
      parameters:
      - description: settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_admin.UpdateSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_admin_SettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: Update runtime settings
      tags:
      - admin
  /admin/settings/history:
    get:
      description: latest changes of the runtime settings, newest first
      parameters:
      - default: 20
        description: page size (1..100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_admin_SettingsHistoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: Settings change history
      tags:
      - admin
  /analytics/kpi:
    get:
      description: Totals, per-status counts, confirmation/closing durations (hours,
        from the status history), refuted share and stale open marks. All filters
        are optional.
      parameters:
      - description: only marks inside this admin boundary
        in: query
        name: boundary_id
        type: integer
      - description: only marks of this type
        in: query
        name: mark_type_id
        type: integer
      - description: marks created at or after (RFC3339 or YYYY-MM-DD, taken as 00:00:00
          UTC)
        in: query
        name: from
        type: string
      - description: marks created at or before (RFC3339 or YYYY-MM-DD, taken as the
          end of that day in UTC)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-github_com_PritOriginal_problem-map-server_internal_models_KPI'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: KPI summary
      tags:
      - analytics
  /analytics/timeseries:
    get:
      description: 'Number of marks created and transitions to confirmed / closed
        / refuted per period; empty periods are returned with zeros. Defaults: step=day,
        to=now, from=to minus 30 days (12 weeks / 12 months for coarser steps).'
      parameters:
      - description: only marks inside this admin boundary
        in: query
        name: boundary_id
        type: integer
      - description: only marks of this type
        in: query
        name: mark_type_id
        type: integer
      - description: start of the range (RFC3339 or YYYY-MM-DD, taken as 00:00:00
          UTC)
        in: query
        name: from
        type: string
      - description: end of the range (RFC3339 or YYYY-MM-DD, taken as the end of
          that day in UTC)
        in: query
        name: to
        type: string
      - default: day
        description: bucket size
        enum:
        - day
        - week
        - month
        in: query
        name: step
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_analytics_GetTimeseriesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Marks time series
      tags:
      - analytics
  /analytics/top-types:
    get:
      description: Mark types ordered by the number of matching marks with their share
        of the total.
      parameters:
      - description: only marks inside this admin boundary
        in: query
        name: boundary_id
        type: integer
      - description: marks created at or after (RFC3339 or YYYY-MM-DD, taken as 00:00:00
          UTC)
        in: query
        name: from
        type: string
      - description: marks created at or before (RFC3339 or YYYY-MM-DD, taken as the
          end of that day in UTC)
        in: query
        name: to
        type: string
      - default: 10
        description: number of rows (1..100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_analytics_GetTopTypesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Top mark types
      tags:
      - analytics
  /api-keys:
    get:
      description: keys owned by the current user (hashes are never returned); an
        admin may pass `all=true` to list every key
      parameters:
      - description: list every key (admin only)
        in: query
        name: all
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_apikeys_GetAPIKeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "403":
          description: all=true by a non-admin
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: issue a read-only key `pm_live_…` for the open-data endpoints.
        The key is returned **once** in `payload.key`; only its hash is stored. Scope
        `read`, 600 requests per minute
      parameters:
      - description: key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_apikeys.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_apikeys_CreateAPIKeyResponse'
        "400":
          description: empty name or expires_at not in the future
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - api-keys
  /api-keys/{id}:
    delete:
      description: deactivate the key; the owner or an admin. Requests with the key
        are answered 401 from now on (another instance may accept it for up to a minute
        from its cache)
      parameters:
      - description: api key id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-internal_handler_apikeys_DeleteAPIKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_PritOriginal_problem-map-server_pkg_responses.Response-any'
      security:
      - BearerAuth: []
      summary: Revoke API key
      tags:
      - api-keys
  /auth/logout:
    post:
      consumes:
      - application/json
      description: revoke the refresh token of the current session; the access token
        stays valid until it expires
      parameters:
      - description: refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_auth.LogoutRequest'
      produces:
      - application/json
      responses:
