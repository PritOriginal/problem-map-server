securityDefinitions:
  ApiKeyAuth:
    description: 'Open-data API key "pm_live_…" (POST /api-keys); also accepted as
      "Authorization: ApiKey {key}". Optional on public GET routes: with a key the
      per-key quota applies and X-RateLimit-* headers are returned; ignored when a
      valid Bearer JWT is sent as well (the JWT identity wins)'
    in: header
    name: X-Api-Key
    type: apiKey
  BearerAuth:
    description: 'JWT access token: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Authorization and authentication
  name: auth
- description: Operations with geodata
  name: map
- description: Operations with markers
  name: marks
- description: Operations with checks
  name: checks
- description: Operations with tasks
  name: tasks
- description: Operations with users
  name: users
- description: User notifications and push devices
  name: notifications
- description: API keys of the open-data endpoints
  name: api-keys
- description: 'Open data: public aggregates'
  name: open
- description: Runtime settings and dictionaries (admin only)
  name: admin
- description: User reports and the moderation queue
  name: moderation
