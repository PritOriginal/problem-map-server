  github_com_PritOriginal_problem-map-server_internal_models.Comment:
    properties:
      body:
        type: string
      comment_id:
        type: integer
      created_at:
        type: string
      deleted:
        description: Deleted reports a soft-deleted comment (body is empty then).
        type: boolean
      is_mine:
        description: |-
          IsMine reports whether the viewer (see ContextWithViewer) wrote the
          comment; always false for anonymous requests.
